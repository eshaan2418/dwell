; Dwell sensor kit firmware (ESP32-DevKitC / WROOM-32, Arduino framework).
;   pio run                      build default env (SHT31)
;   pio run -t upload            flash;  pio device monitor  serial console (115200)
;   pio run -e esp32dev_bme280   variant with a BME280 instead of the SHT31
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/pio_config.py
board_build.partitions = default.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DCORE_DEBUG_LEVEL=0
; host tests live in test_host/ (make host-test), not PlatformIO's test runner
test_ignore = *

[env:esp32dev]

[env:esp32dev_bme280]
build_flags = ${env.build_flags} -DDWELL_CLIMATE_BME280
lib_deps = adafruit/Adafruit BME280 Library@^2.2.4
