[project]
name = "dwell"
version = "0.1.0"
description = "Dwell: predict lived conditions (sun, night noise, summer heat) from a phone walkthrough + public geodata, validated against in-home sensors."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pvlib>=0.11",
  "shapely>=2.0",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "requests>=2.32",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-requests", "clang-format>=18"]
vision = ["opencv-python-headless>=4.10", "trimesh>=4.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "synth*", "ingest*", "recon*", "semantics*", "locate*", "physics*", "hybrid*", "bench*", "study*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app", "firmware", "paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["core", "synth", "ingest", "physics", "hybrid", "locate", "recon", "semantics", "bench", "study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
